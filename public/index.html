<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Application Studio | CV & Submission Letter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="navbar">
        <div class="logo">ApplyCraft</div>
        <span class="tagline">Automatic CV & Tailored Letter Studio</span>
    </header>

    <main class="workspace">
        <!-- Left Panel: Inputs -->
         <section class="panel input-panel">
            <h2>1. Your Details & Goal</h2>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Example: Sarah Jenkins" required/>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="sarah@example.com"/>
                </div>
                <div class="form-group">
                    <label>Phone / City</label>
                    <input type="text" id="phone" placeholder="+237 6 12 87 63 75"/>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Target Role</label>
                    <input type="text" id="targetJob" placeholder="Example: Project Manager" required/>
                </div>
                <div class="form-group">
                    <label>Company / Institution</label>
                    <input type="text" id="company" placeholder="Example: Arc Corp"/>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Experience Level</label>
                    <select id="experienceLevel">
                        <option value="Entry / Student">Student / Entry-Level</option>
                        <option value="Mid-Level" selected>Mid-Level Professional</option>
                        <option value="Senior / Executive">Senior / Career Switcher</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tone</label>
                    <select id="tone">
                        <option value="Confident & Professional" selected>Confident & Professional</option>
                        <option value="Formal & Traditional">Formal & Traditional</option>
                        <option value="Modern & Creative">Modern & Creative</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Describe your experience / key skills (even rough notes work)</label>
                <textarea id="bio" rows="6" placeholder="Example: 3 years handling logistics in retail. Good with Excel, team leading, solving shipping delays. Organized 4 major university events..."></textarea>
            </div>

            <button id="generateBtn" class="btn-primary">Generate CV & Letter</button>
         </section>

         <!-- Right Panel: Live Output -->
          <section class="panel output-panel">
            <div class="tabs-header">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="cvView">CV Document</button>
                    <button class="tab-btn" data-tab="letterView">Letter of Submission</button>
                </div>
                <div class="action-buttons">
                    <button id="copyBtn" class="btn-secondary">Copy Text</button>
                    <button id="printBtn" class="btn-secondary">Print / Save PDF</button>
                </div>
            </div>

            <div class="edit-hint">Tip: You can click anywhere inside the document below to edit the text directly!</div>

            <div class="document-container">
                <div id="cvView" class="tab-content active doc-sheet">
                    <div class="placeholder-state">Fill out your details on the left and  click "generate" to preview your CV.</div>
                </div>

                <div id="letterView" class="tab-content doc-sheet">
                    <div class="placeholder-state">Your tailored submission letter will appear here.</div>
                </div>
            </div>
          </section>
    </main>
    
</body>
</html>
